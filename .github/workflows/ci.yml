name: CI
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
on:
  push:
    branches: [main, 'upgrade/**', 'sales/**', 'integration/**', 'feature/**']
  pull_request:
    branches: [main, 'sales/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: real_estate_api
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d real_estate_api"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/real_estate_api
      JWT_SECRET: ci-only-test-secret-please-never-use-in-production-123
      ADMIN_BOOTSTRAP_TOKEN: ci-only-bootstrap-token-never-use-in-production-123456
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm install
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run verify
